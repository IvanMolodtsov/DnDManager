{{if .Results}}
  <ul class="space-y-2">
    {{range .Results}}
      <li class="flex flex-wrap items-center justify-between gap-2 rounded border border-gold/15 px-3 py-2 text-sm">
        <div>
          <strong>{{.Name $.Lang}}</strong>
          <span class="ml-1 text-xs text-parchment/50">{{.StatsLine}}</span>
        </div>
        {{if $.SummonUnit}}
          <form class="flex items-center gap-2"
                hx-post="/campaigns/{{$.Campaign.ID}}/battle/units/{{$.SummonUnit.ID}}/summon"
                hx-target="#summon-body" hx-swap="innerHTML">
            <input type="hidden" name="csrf_token" value="{{$.CSRF}}">
            <input type="hidden" name="spell" value="{{$.SummonSpell}}">
            <input type="hidden" name="monster_id" value="{{.ID}}">
            <label class="flex items-center gap-1 text-xs">
              <span>{{ t "battle.qty" }}</span>
              <input class="input" style="width:4rem;margin-top:0;padding:.25rem .4rem" type="number" name="qty" min="1" max="8" value="1">
            </label>
            <button class="btn-gold" type="submit">{{ t "battle.summon.add" }}</button>
          </form>
        {{end}}
      </li>
    {{end}}
  </ul>
{{end}}
