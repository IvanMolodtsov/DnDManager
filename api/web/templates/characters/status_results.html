{{if .StatusResults}}
  <ul class="space-y-1">
    {{range .StatusResults}}
      <li>
        <button type="button" class="btn-ghost w-full" style="justify-content:flex-start;padding:.25rem .5rem;font-size:.8rem"
                hx-get="{{$.StatusNewURL}}?condition_id={{.ID}}&amp;q={{$.StatusQuery}}"
                hx-target="#status-add-body" hx-swap="innerHTML">
          {{.Name $.Lang}}
          {{if not .IsPHB}}<span class="inv-tag">{{ t "character.status.custom" }}</span>{{end}}
        </button>
      </li>
    {{end}}
  </ul>
{{end}}
