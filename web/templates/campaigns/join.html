{{template "header" .}}
<section class="card mx-auto max-w-md">
  <h1 class="font-display text-2xl text-gold">{{ t "campaign.join.title" }}</h1>
  <p class="mt-2 text-sm text-parchment/70">{{ t "campaign.join.lead" }}</p>
  {{template "error" .}}
  <form class="mt-6 space-y-4" method="post" action="/campaigns/join">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <label class="block text-sm">
      <span>{{ t "campaign.invite" }}</span>
      <input class="input uppercase tracking-widest" type="text" name="invite" value="{{.Invite}}" required autocomplete="off">
    </label>
    <button class="btn-gold w-full" type="submit">{{ t "campaign.join.submit" }}</button>
  </form>
  <p class="mt-4"><a class="text-sm text-gold/80 hover:text-gold" href="/campaigns">{{ t "common.back" }}</a></p>
</section>
{{template "footer" .}}
