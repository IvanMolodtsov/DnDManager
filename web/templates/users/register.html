{{template "header" .}}
<section class="card mx-auto max-w-md">
  <h1 class="font-display text-2xl text-gold">{{ t "auth.register.title" }}</h1>
  <p class="mt-2 text-sm text-parchment/70">{{ t "auth.register.lead" }}</p>
  {{template "error" .}}
  <form class="mt-6 space-y-4" method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <label class="block text-sm">
      <span>{{ t "auth.username" }}</span>
      <input class="input" type="text" name="username" value="{{.Username}}" autocomplete="username" required minlength="3" maxlength="32">
    </label>
    <label class="block text-sm">
      <span>{{ t "auth.password" }}</span>
      <input class="input" type="password" name="password" autocomplete="new-password" required minlength="8">
      <span class="mt-1 block text-xs text-parchment/50">{{ t "auth.password.hint" }}</span>
    </label>
    <button class="btn-gold w-full" type="submit">{{ t "auth.register.submit" }}</button>
  </form>
  <p class="mt-4 text-sm text-parchment/70">{{ t "auth.have.account" }} <a class="text-gold hover:underline" href="/login">{{ t "nav.login" }}</a></p>
</section>
{{template "footer" .}}
