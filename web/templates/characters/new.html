{{template "header" .}}
<section class="card mx-auto max-w-md">
  <h1 class="font-display text-2xl text-gold">{{ t "character.create.title" }}</h1>
  <p class="mt-2 text-sm text-parchment/70">{{ t "character.create.lead" }}</p>
  <p class="mt-1 text-xs text-gold/70">{{.Campaign.Name}}</p>
  {{template "error" .}}
  <form class="mt-6 space-y-4" method="post" action="/campaigns/{{.Campaign.ID}}/characters">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <label class="block text-sm">
      <span>{{ t "character.name" }}</span>
      <input class="input" type="text" name="name" value="{{.Name}}" required maxlength="80">
    </label>
    <button class="btn-gold w-full" type="submit">{{ t "character.create.submit" }}</button>
  </form>
  <p class="mt-4"><a class="text-sm text-gold/80 hover:text-gold" href="/campaigns/{{.Campaign.ID}}">{{ t "common.back" }}</a></p>
</section>
{{template "footer" .}}
