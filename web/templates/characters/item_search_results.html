{{if .Results}}
  <ul class="spell-list mt-3">
    {{range .Results}}
      <li class="spell-row">
        <div>
          <span class="text-gold">{{.Name $.Lang}}</span>
          <p class="text-xs text-parchment/60">
            {{.Kind}}{{$stats := .StatsLine}}{{if $stats}} · {{$stats}}{{end}}
            {{if .IsStub}} · {{ t "character.item.stub" }}{{end}}
          </p>
        </div>
        <button class="btn-gold" type="button"
                hx-get="/characters/{{$.Character.ID}}/items/{{.ID}}/preview"
                hx-target="#item-add-body" hx-swap="innerHTML">
          {{ t "common.next" }}
        </button>
      </li>
    {{end}}
  </ul>
{{else if .Query}}
  <p class="mt-3 text-sm text-parchment/45">{{ t "character.inventory.search.empty" }}</p>
{{end}}
