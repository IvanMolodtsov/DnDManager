<section class="card">
  <h2 class="font-display text-xl text-gold">{{ t "battle.setup.monsters" }}</h2>
  {{if .IsDM}}
    <p class="mt-1 text-xs text-parchment/50">{{ t "battle.setup.monsters.note" }}</p>
    <div class="mt-4 grid gap-3 sm:grid-cols-2">
      <label class="block text-sm">
        <span>{{ t "battle.search" }}</span>
        <input id="monster-search-q" class="input" type="search" name="q" value="{{.Query}}"
               placeholder="{{ t "battle.search.ph" }}"
               hx-get="/campaigns/{{.Campaign.ID}}/battle/monsters/search"
               hx-trigger="keyup changed delay:300ms, search"
               hx-include="#monster-search-cr"
               hx-target="#monster-search-results" hx-swap="innerHTML"
               autocomplete="off">
      </label>
      <label class="block text-sm">
        <span>{{ t "battle.cr" }}</span>
        <select id="monster-search-cr" class="input" name="cr"
                hx-get="/campaigns/{{.Campaign.ID}}/battle/monsters/search"
                hx-include="#monster-search-q"
                hx-target="#monster-search-results" hx-swap="innerHTML">
          <option value="">{{ t "battle.cr.any" }}</option>
          {{range .CRs}}
            <option value="{{.}}" {{if eq . $.CR}}selected{{end}}>{{.}}</option>
          {{end}}
        </select>
      </label>
    </div>
    <div id="monster-search-results" class="mt-3">
      {{template "battles/monster_results.html" .}}
    </div>
  {{end}}
  {{template "battles/monster_roster.html" .}}
</section>
