{{if .Results}}
  <ul class="space-y-2">
    {{range .Results}}
      <li class="flex flex-wrap items-center justify-between gap-2 rounded border border-gold/15 px-3 py-2 text-sm">
        <div>
          <strong class="text-parchment">{{.Name $.Lang}}</strong>
          {{if .IsStub}}<span class="inv-tag">{{ t "battle.monster.stub" }}</span>{{end}}
          <span class="ml-1 text-xs text-parchment/50">{{.StatsLine}}</span>
        </div>
        {{if $.IsDM}}
          <div class="flex flex-wrap items-center gap-2">
            <button type="button" class="btn-ghost"
                    hx-get="/campaigns/{{$.Campaign.ID}}/battle/monsters/{{.ID}}/preview"
                    hx-target="#monster-preview-body" hx-swap="innerHTML">{{ t "battle.preview" }}</button>
            <form class="flex items-center gap-2"
                  hx-post="/campaigns/{{$.Campaign.ID}}/battle/monsters"
                  hx-target="#monster-roster" hx-swap="outerHTML">
              <input type="hidden" name="csrf_token" value="{{$.CSRF}}">
              <input type="hidden" name="monster_id" value="{{.ID}}">
              <label class="flex items-center gap-1 text-xs">
                <span>{{ t "battle.qty" }}</span>
                <input class="input" style="width:4rem;margin-top:0;padding:.25rem .4rem" type="number" name="qty" min="1" max="20" value="1">
              </label>
              <button class="btn-gold" type="submit">{{ t "battle.add" }}</button>
            </form>
          </div>
        {{end}}
      </li>
    {{end}}
  </ul>
{{end}}
